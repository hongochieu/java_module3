<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container{
            width: 800px;
            margin: auto;
        }

        .logo{
            width: 190px;
            height: 50px;
            background-color: #7f8ccf;
            color: white;
            line-height: 50px;
            margin: auto;
            font-size: 24px;
        }

        h1{
            font-size: 48px;
            font-weight: normal;
        }

        h1 span{
            color: #00aaff;
            font-weight: bold;
        }

        p{
            color: gray;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .btn{
            display: inline-block;
            background-color: #2d2d2d;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover{
            background-color: #00aaff;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="logo">190 x 50</div>
        <h1>
            Best <span>Shared Hosting</span> Company
        </h1>
        <p>
            With this responsive landing page template, you can promote your all hosting, domain and email services.
        </p>
        <a href="#" class="btn">View Plans</a>
        <a href="#" class="btn">All Features</a>
    </div>
</body>
</html>
